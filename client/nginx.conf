server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Load the standard MIME type map so HTML/JS/CSS/SVG etc. are served
    # with the correct Content-Type and render in the browser instead of
    # being downloaded as application/octet-stream.
    include /etc/nginx/mime.types;

    # Safety net: if a proxied response's MIME type is missing or
    # unrecognized (e.g. some binary exports), download it instead of
    # rendering garbage inline.
    types {
        application/octet-stream bin;
    }
    default_type application/octet-stream;

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check proxy
    location /health {
        proxy_pass http://api:8000;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
